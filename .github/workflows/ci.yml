name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Prettier check
        run: |
          npm run format:check

      - name: Theme tokens single-source-of-truth check
        # The theme presets (src/components/theme/themes/*.ts) are the only
        # place tokens may be defined. theme.css is generated from lightTheme.
        # 1) regenerate and diff -> catches hand-edits to theme.css and
        #    forgotten regeneration after preset changes
        # 2) check script -> catches key-set drift between the 5 presets
        #    (a token missing from one preset becomes a stale variable when
        #    users switch themes)
        run: |
          python3 scripts/generate_theme_css.py
          git diff --exit-code src/components/theme/theme.css || {
            echo "::error::src/components/theme/theme.css is out of date or was hand-edited."
            echo "::error::Edit src/components/theme/themes/*.ts instead, then run: npm run tokens:generate"
            exit 1
          }
          npm run tokens:check

      - name: Typecheck
        run: |
          npx tsc --noEmit

      - name: Run tests with coverage
        env:
          CI: true
        run: |
          npm test -- --ci --coverage

      - name: Build library
        run: |
          npm run build:all

      - name: Size budgets
        # Reports per-component file sizes vs .size-limit.json budgets.
        # Uses @size-limit/file (measures the built dist/esm files directly,
        # no re-bundling). The file measurement reflects the actual size
        # users ship, not a tree-shaken best-case. Size budgets are enforced
        # — a regression that grows a component past its limit fails CI.
        run: |
          npm run size

  # React 19 compatibility — runs the full test suite against React 19
  # (the main build-test job runs against React 18 via the lockfile).
  # The peer dep range is ^18 || ^19; this job catches regressions on
  # the React 19 side. --legacy-peer-deps is needed because
  # @testing-library/react declares react@^18 as a peer (it works fine
  # with 19, but npm v7+ blocks the install without this flag).
  test-react-19:
    name: Tests (React 19)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Override React to v19
        run: npm install react@19 react-dom@19 --no-save --legacy-peer-deps

      - name: Run tests
        env:
          CI: true
        run: npm test -- --ci
