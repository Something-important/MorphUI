name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Lint
        run: |
          npm run lint

      - name: Prettier check
        run: |
          npm run format:check

      - name: Typecheck
        run: |
          npx tsc --noEmit

      - name: Run tests with coverage
        env:
          CI: true
        run: |
          npm test -- --ci --coverage

      - name: Build library
        run: |
          npm run build:all
