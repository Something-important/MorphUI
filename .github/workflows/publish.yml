name: Publish to npm

# Fires when release-please creates a `v*` tag (i.e. when a release PR
# merges into master). Also runnable on demand from the Actions tab.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The npm CLI
# detects the GitHub Actions OIDC context and exchanges the short-lived
# JWT for publish credentials.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the npm registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm to v11+ (required for trusted publishing)
        # npm 11.5.1+ is the minimum that supports OIDC trusted publishing.
        # Node 22 ships with npm 10.x, which can sign provenance but cannot
        # exchange the OIDC JWT for publish credentials — resulting in a
        # misleading "404 Not Found" on the publish PUT.
        run: npm install -g npm@latest

      - name: Print npm version (sanity check)
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library (JS + types + extracted CSS)
        run: npm run build:all

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish with provenance (OIDC trusted publishing)
        run: |
          unset NODE_AUTH_TOKEN
          echo "NODE_AUTH_TOKEN is now: '${NODE_AUTH_TOKEN:-<unset>}'"
          npm publish --provenance

      - name: Dump publish debug log on failure
        if: failure()
        run: |
          echo "=== newest npm debug log ==="
          cat "$(ls -t /home/runner/.npm/_logs/*-debug-0.log | head -1)" | tail -60 || true
