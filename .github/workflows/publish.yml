name: Publish to npm

# Fires when release-please creates a `v*` tag (i.e. when a release PR
# merges into master). Also runnable on demand from the Actions tab,
# and callable from the release-please workflow so that a release-please
# tag creation auto-publishes without a separate manual dispatch.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret.
# Requires npm CLI 11.5.1+ (Node 22.14.0+). Node 22 ships with npm 10.x,
# which can sign provenance but cannot do the OIDC token exchange, so we
# upgrade npm in-place before publishing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the npm registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        # No `registry-url` here on purpose:
        #   - Trusted publishing via OIDC doesn't need a token in ~/.npmrc.
        #   - Passing `registry-url` makes actions/setup-node write
        #     `always-auth=true` to ~/.npmrc, which npm 11+ warns about
        #     and npm 12 will reject outright.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upgrade npm to v11+ (required for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Print npm version (sanity check)
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build library (JS + types + extracted CSS)
        run: npm run build:all

      - name: Show what will be published
        run: npm pack --dry-run

      - name: Publish with provenance (OIDC trusted publishing)
        run: npm publish --provenance

      - name: Dump publish debug log on failure
        if: failure()
        run: |
          echo "=== newest npm debug log ==="
          cat "$(ls -t /home/runner/.npm/_logs/*-debug-0.log | head -1)" | tail -60 || true
