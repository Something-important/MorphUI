name: Publish to npm

# Fires when release-please creates a `v*` tag (i.e. when a release PR
# merges into master). Also runnable on demand from the Actions tab.
#
# Uses npm Trusted Publishing (OIDC) — no NPM_TOKEN secret. The npm CLI
# detects the GitHub Actions OIDC context and exchanges the short-lived
# JWT for publish credentials.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC — lets the workflow request a JWT from GitHub that
  # npm exchanges for short-lived publish credentials. Also drives
  # automatic provenance attestation (Sigstore).
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to the npm registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          # Don't use the cache in release builds — ensures a clean,
          # reproducible install from the lockfile.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build library (JS + types + extracted CSS)
        run: npm run build:all

      - name: Show what will be published
        # Logs the tarball contents — catches "CSS didn't ship" regressions
        run: npm pack --dry-run

      - name: Publish with provenance (OIDC trusted publishing)
        run: |
          # A stray NODE_AUTH_TOKEN hijacks npm auth: npm prefers an
          # explicit token over the OIDC exchange, and an invalid token
          # makes the registry answer 404 "not in this registry".
          # Unset it so npm authenticates via trusted publishing.
          unset NODE_AUTH_TOKEN
          echo "NODE_AUTH_TOKEN is now: '${NODE_AUTH_TOKEN:-<unset>}'"
          npm publish --provenance

      - name: Dump publish debug log on failure
        if: failure()
        run: |
          echo "=== newest npm debug log ==="
          cat "$(ls -t /home/runner/.npm/_logs/*-debug-0.log | head -1)" | tail -60 || true
